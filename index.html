<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YouTube MP3 추출기</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 300px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>YouTube 음원 추출기 🎵</h1>
  <p>유튜브 링크를 입력하세요.</p>
  <input type="text" id="youtubeURL" placeholder="https://www.youtube.com/watch?v=xxxxx">
  <button onclick="downloadMP3()">MP3 다운로드</button>

  <script>
    function downloadMP3() {
      const url = document.getElementById('youtubeURL').value;
      if (!url) {
        alert("유튜브 링크를 입력하세요.");
        return;
      }
      const downloadUrl = `https://youtube-mp3-server.onrender.com/download?url=${encodeURIComponent(url)}`;
      window.open(downloadUrl, '_blank');
    }
  </script>
</body>
</html>
